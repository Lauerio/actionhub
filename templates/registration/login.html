{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block banner %}{% endblock %}

{% block conteudo %}
<div class="auth-card">
  <h2 class="text-center mb-4">Entrar</h2>

  <form method="post">
    {% csrf_token %}

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Usuário ou senha incorretos.</div>
    {% endif %}

    <div class="mb-3">
      <label for="id_username" class="form-label">Usuário</label>
      <input type="text" name="username" id="id_username" class="form-control" placeholder="Seu usuário" required autofocus>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Senha</label>
      <input type="password" name="password" id="id_password" class="form-control" placeholder="Sua senha" required>
    </div>

    <button class="btn btn-dark w-100 mt-2">Entrar</button>
  </form>

  <p class="text-center small mt-3 mb-0">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
